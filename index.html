<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,100..900&family=Google+Sans:wght@400..700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  :root { --ink:#060607; --blurple:#5865f2; --blurple-d:#4752c4; --glass:rgba(255,255,255,.06); --glass-line:rgba(255,255,255,.11);
          --muted:rgba(255,255,255,.62); }
  html { zoom:.9; }   /* the app's default size is 90%, like pressing zoom-out once in the browser */
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:#fff; font-family:"Google Sans",system-ui,-apple-system,sans-serif; font-size:15px; -webkit-font-smoothing:antialiased; }
  body { background:
      radial-gradient(90% 55% at 82% 108%, rgba(32,32,140,.38), transparent 62%),
      radial-gradient(70% 45% at 8% 100%, rgba(22,22,104,.28), transparent 65%),
      linear-gradient(180deg,#000007 0%,#02021a 30%,#05052b 60%,#0a0a4b 100%);
    background-attachment:fixed; overflow:hidden; }
  button { font-family:inherit; }
  .display { font-family:Archivo,"Arial Black",Impact,sans-serif; font-stretch:125%; font-weight:900; text-transform:uppercase; letter-spacing:-.015em; line-height:.94; }

  .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .stars i { position:absolute; border-radius:50%; background:#aab2ff; opacity:.3; animation:tw var(--d,5s) ease-in-out infinite alternate; }
  .stars i.plus { background:none; border-radius:0; }
  .stars i.plus::before, .stars i.plus::after { content:''; position:absolute; background:#aab2ff; left:50%; top:50%; transform:translate(-50%,-50%); }
  .stars i.plus::before { width:100%; height:1.5px; } .stars i.plus::after { width:1.5px; height:100%; }
  @keyframes tw { from { opacity:.12; } to { opacity:.6; } }

  .app { position:relative; z-index:1; height:100%; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:76px minmax(0,1fr) auto auto auto; }

  /* header */
  .top { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 32px; }
  .logo { display:inline-flex; align-items:center; gap:10px; font-size:22px; justify-self:start; line-height:1; }
  .logo svg { display:block; }
  .nav { display:flex; gap:6px; }
  .navbtn { background:none; border:0; color:#fff; font-weight:600; font-size:16px; padding:9px 16px; border-radius:14px; cursor:pointer; transition:background .15s, opacity .15s; }
  .navbtn:hover:not(:disabled) { background:rgba(255,255,255,.1); } .navbtn:disabled { opacity:.4; cursor:default; }
  .topr { justify-self:end; }

  .btn { border:0; cursor:pointer; font-weight:600; border-radius:16px; display:inline-flex; align-items:center; justify-content:center; gap:10px;
    transition:background .15s, transform .12s, opacity .15s; font-size:16px; height:50px; padding:0 26px; white-space:nowrap; }
  .btn:active:not(:disabled) { transform:scale(.97); } .btn:disabled { opacity:.4; cursor:default; }
  .btn.white { background:#fff; color:var(--ink); } .btn.white:hover:not(:disabled) { background:#e8e9ff; }
  .btn.blurple { background:var(--blurple); color:#fff; } .btn.blurple:hover:not(:disabled) { background:var(--blurple-d); }
  .btn.glass { background:rgba(255,255,255,.1); color:#fff; } .btn.glass:hover:not(:disabled) { background:rgba(255,255,255,.17); }
  .btn.sm { height:40px; padding:0 18px; font-size:14px; border-radius:13px; }
  .btn.pill { height:44px; padding:0 22px; border-radius:999px; font-size:15px; }

  /* stage */
  .stage { display:grid; grid-template-columns:minmax(0,1fr); padding:4px 32px 14px; min-height:0; }

  .drop { position:relative; width:100%; height:100%; min-height:240px; border-radius:28px; background:rgba(4,4,28,.55); border:1px solid var(--glass-line);
    box-shadow:0 40px 90px rgba(0,0,20,.55), inset 0 0 0 1px rgba(255,255,255,.03); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; transition:border-color .2s, box-shadow .2s; }
  .drop:hover, .drop.over { border-color:rgba(120,132,255,.65); box-shadow:0 40px 90px rgba(0,0,20,.55), 0 0 0 4px rgba(88,101,242,.22); }
  body.has .drop { cursor:default; background:rgba(0,0,12,.55); }
  body.has .drop:hover { border-color:var(--glass-line); box-shadow:0 40px 90px rgba(0,0,20,.55); }
  .ph { text-align:center; color:var(--muted); }
  .ph > svg { display:block; margin:0 auto 14px; opacity:.85; }
  .btn svg { flex:none; display:block; }
  .ph b { display:block; color:#fff; font-size:20px; font-weight:600; margin-bottom:4px; }
  .ph .btn { margin-top:22px; }
  body.has .ph { display:none; }
  canvas { max-width:100%; max-height:100%; display:none; }
  body.has canvas { display:block; }
  .replace { position:absolute; top:16px; right:16px; display:none; background:rgba(255,255,255,.14); backdrop-filter:blur(12px); color:#fff; border:0;
    padding:9px 16px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; }
  .replace:hover { background:rgba(255,255,255,.22); } body.has .replace { display:block; }
  .caption { position:absolute; left:16px; bottom:16px; display:none; align-items:center; gap:10px; padding:8px 14px; border-radius:12px;
    background:rgba(0,0,0,.45); backdrop-filter:blur(12px); font-size:13px; font-weight:600; }
  .caption i { width:3px; height:3px; border-radius:50%; background:var(--muted); } .caption #fdim { color:var(--muted); font-weight:500; }
  body.has .caption { display:flex; } .drop:has(.overlay.on) .caption { display:none; }
  .tag { display:none !important; }

  /* control dock */
  .dock { display:flex; justify-content:center; padding:0 32px; }
    .card { background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(16px); border-radius:22px; padding:12px 22px;
    display:flex; align-items:center; justify-content:center; gap:14px 30px; flex-wrap:wrap; }
  .controls.off { opacity:.4; pointer-events:none; } .controls.hide { display:none; }
  .ctl { display:flex; align-items:center; gap:14px; font-weight:600; }
  .ctl output { min-width:44px; text-align:right; color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:170px; height:5px; border-radius:3px; outline:none; cursor:pointer;
    background:linear-gradient(to right,#fff var(--p,0%),rgba(255,255,255,.2) var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; border:0; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#fff; border:0; }
  #ang { background:rgba(255,255,255,.2); }
  .croppanel { display:none; } .croppanel.on { display:flex; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .chip { background:rgba(255,255,255,.1); border:0; color:#fff; font-weight:600; font-size:13px; padding:9px 14px; border-radius:12px; cursor:pointer; transition:background .15s; }
  .chip:hover { background:rgba(255,255,255,.18); } .chip.active { background:#fff; color:var(--ink); }
  .msg { font-size:12px; color:var(--muted); max-width:210px; min-height:16px; }
  .cropact { display:flex; gap:8px; }
  .hidden { display:none; }

  /* download split button + format menu */
  .split { position:relative; display:flex; gap:2px; }
  .split #dl { border-radius:13px 4px 4px 13px; } .split .caret { border-radius:4px 13px 13px 4px; padding:0 12px; }
  .fmt { margin-left:2px; padding:2px 7px; border-radius:6px; background:rgba(6,6,7,.09); font-size:12px; font-weight:700; }
  .menu { display:none; position:absolute; top:calc(100% + 10px); right:0; width:320px; padding:8px; z-index:30; border-radius:20px;
    background:rgba(12,12,46,.94); backdrop-filter:blur(20px); border:1px solid var(--glass-line); box-shadow:0 24px 60px rgba(0,0,12,.6); }
  .menu.open { display:block; }
  .mi { width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:none; border:0; color:#fff; padding:10px 12px; border-radius:13px; cursor:pointer; }
  .mi:hover { background:rgba(255,255,255,.09); }
  .mi .t { flex:1; min-width:0; } .mi .n { font-weight:600; font-size:14px; } .mi .d { color:var(--muted); font-size:12px; margin-top:1px; }
  .mi .ck { width:16px; height:16px; opacity:0; } .mi.sel .ck { opacity:1; }
  .mq { margin:6px 4px 4px; padding:12px 12px 8px; border-top:1px solid var(--glass-line); display:none; }
  .mq.on { display:block; } .mq .ctl { justify-content:space-between; font-size:13px; } .mq input[type=range] { width:150px; }
  .toast { position:fixed; left:50%; bottom:200px; transform:translate(-50%,12px); padding:11px 18px; border-radius:14px; z-index:40; opacity:0; pointer-events:none;
    background:rgba(255,255,255,.95); color:var(--ink); font-weight:600; font-size:14px; transition:opacity .2s, transform .2s; max-width:80vw; text-align:center; }
  .toast.on { opacity:1; transform:translate(-50%,0); }

  /* adjustments tab */
  .adjpanel { display:none; }
  .adjpanel.on { display:grid; grid-template-columns:repeat(4,minmax(150px,210px)) auto; gap:12px 30px; align-items:center; }
  .adj .ah { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; font-weight:600; font-size:14px; }
  .adj .ah output { color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums; }
  .adj input[type=range] { width:100%; height:4px; background:linear-gradient(to right, rgba(255,255,255,.2) var(--a,50%), #fff var(--a,50%), #fff var(--b,50%), rgba(255,255,255,.2) var(--b,50%)); }
  @media (max-width:900px) { .adjpanel.on { grid-template-columns:repeat(2,minmax(0,1fr)); } .adjpanel .btn { grid-column:1 / -1; } }

  /* remove-photo confirmation */
  .sheet.small { width:min(420px,100%); padding:30px 26px 24px; text-align:center; }
  .sheet.small h2 { font-size:24px; }
  .cthumb { display:block; width:76px; height:76px; margin:0 auto 16px; border-radius:18px; object-fit:cover; box-shadow:0 10px 30px rgba(0,0,20,.5), 0 0 0 1px rgba(255,255,255,.18); }
  .ctext { color:var(--muted); margin:10px auto 0; max-width:320px; line-height:1.45; } .ctext b { color:#fff; font-weight:600; word-break:break-all; }
  .cact { display:flex; gap:10px; margin-top:24px; } .cact .btn { flex:1; }
  .btn.danger { background:#ff4d5e; color:#fff; } .btn.danger:hover:not(:disabled) { filter:brightness(1.1); }

  /* multiple photos */
  .photos { display:none; align-items:center; gap:16px; padding:0 32px 10px; }
  body.has .photos { display:flex; }
  .thumbs { flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; padding:4px 3px; scrollbar-width:none; }
  .thumbs::-webkit-scrollbar { display:none; }
  .pt { position:relative; flex:none; width:56px; height:56px; border-radius:13px; overflow:hidden; cursor:pointer; background:#000; border:2px solid transparent; opacity:.72; transition:opacity .15s, border-color .15s, transform .15s; }
  .pt img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .pt:hover { opacity:1; } .pt.on { border-color:#fff; opacity:1; }
  .pt .rm { position:absolute; top:2px; right:2px; width:19px; height:19px; border-radius:50%; border:0; padding:0; background:rgba(0,0,10,.7); color:#fff; font-size:13px; line-height:1; cursor:pointer; display:none; place-items:center; }
  .pt:hover .rm, .pt.on .rm { display:grid; } .pt .rm:hover { background:#000; }
  .pact { display:flex; align-items:center; gap:10px; flex:none; }
  .pcount { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; margin-right:2px; }
  .busy { position:fixed; inset:0; z-index:55; display:none; align-items:center; justify-content:center; background:rgba(0,0,12,.45); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .busy.on { display:flex; }
  .busybox { min-width:260px; padding:22px 26px; border-radius:22px; text-align:center; display:grid; gap:14px; justify-items:center;
    background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.05)), rgba(8,8,44,.75); border:1px solid var(--glass-edge); box-shadow:var(--glass-shadow); }
  .busybox .spin { width:22px; height:22px; border-color:rgba(255,255,255,.25); border-top-color:#fff; }
  .busybox b { font-weight:600; }
  .bar { width:100%; height:5px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; } .bar i { display:block; height:100%; width:0; background:#fff; transition:width .2s; }
  @media (max-width:900px) { .photos { padding:0 14px 8px; gap:10px; } .pt { width:48px; height:48px; } .pcount { display:none; } }

  /* crop overlay */
  .overlay { position:absolute; display:none; overflow:hidden; pointer-events:none; touch-action:none; }
  .overlay.on { display:block; }
  .cropbox { position:absolute; border:1.5px solid #fff; cursor:move; pointer-events:auto; box-shadow:0 0 0 9999px rgba(0,0,8,.62);
    background:
      linear-gradient(#fff6,#fff6) 33.333% 0/1px 100% no-repeat, linear-gradient(#fff6,#fff6) 66.666% 0/1px 100% no-repeat,
      linear-gradient(#fff6,#fff6) 0 33.333%/100% 1px no-repeat, linear-gradient(#fff6,#fff6) 0 66.666%/100% 1px no-repeat; }
  .h { position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; }
  .h::after { content:''; position:absolute; inset:8px; background:#fff; border-radius:3px; box-shadow:0 0 0 1px rgba(0,0,0,.4); }
  .h.nw{left:0;top:0;cursor:nwse-resize}.h.n{left:50%;top:0;cursor:ns-resize}.h.ne{left:100%;top:0;cursor:nesw-resize}
  .h.e{left:100%;top:50%;cursor:ew-resize}.h.se{left:100%;top:100%;cursor:nwse-resize}.h.s{left:50%;top:100%;cursor:ns-resize}
  .h.sw{left:0;top:100%;cursor:nesw-resize}.h.w{left:0;top:50%;cursor:ew-resize}
  .overlay.locked .h.n,.overlay.locked .h.e,.overlay.locked .h.s,.overlay.locked .h.w { display:none; }

  /* film shelf */
  .strip { display:flex; justify-content:safe center; gap:0; overflow-x:auto; padding:16px 24px 24px; scrollbar-width:none; }
  .strip::-webkit-scrollbar { display:none; }
  .film { flex:0 0 112px; background:none; border:0; color:var(--muted); cursor:pointer; padding:0; display:flex; flex-direction:column; align-items:center; gap:9px;
    font-size:12px; font-weight:600; text-align:center; transition:color .15s; position:relative; }
  .film svg, .film img { width:100px; height:108px; object-fit:contain; overflow:visible; transition:transform .3s cubic-bezier(.2,.8,.2,1), filter .3s; filter:drop-shadow(0 8px 6px rgba(0,0,12,.6)); }
  .film:hover { color:#fff; } .film:hover svg, .film:hover img { transform:translateY(-5px) rotate(-3deg); }
  .film.active { color:#fff; }
  .film.active svg, .film.active img { transform:translateY(-8px); filter:drop-shadow(0 12px 9px rgba(0,0,12,.7)) drop-shadow(0 0 16px rgba(88,101,242,.55)); }
  .film.active::after { content:''; width:5px; height:5px; border-radius:50%; background:#fff; position:absolute; bottom:-10px; }
  input[type=file] { display:none; }
  @media (max-width:900px) {
    .stage { padding:4px 16px 12px; } .top { padding:0 20px; }
  }

  /* glass: translucent fill, frosted blur, bright top edge */
  :root { --glass-fill:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.035) 42%,rgba(255,255,255,.075));
          --glass-edge:rgba(255,255,255,.2);
          --glass-shadow:inset 0 1px 0 rgba(255,255,255,.32), inset 1px 0 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(255,255,255,.04), 0 24px 60px rgba(0,0,20,.45); }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(42% 36% at 14% 86%,rgba(58,58,215,.30),transparent 70%), radial-gradient(36% 30% at 90% 58%,rgba(105,58,225,.20),transparent 70%), radial-gradient(32% 26% at 56% 6%,rgba(40,62,205,.16),transparent 70%); }
  .drop, body.has .drop, .drop:hover, body.has .drop:hover, .card {
    background:var(--glass-fill); border:1px solid var(--glass-edge); box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:blur(26px) saturate(170%); backdrop-filter:blur(26px) saturate(170%); }
  .drop:hover { border-color:rgba(160,170,255,.5); }
  .drop.over, body.has .drop.over { border-color:rgba(140,152,255,.85); box-shadow:var(--glass-shadow), 0 0 0 4px rgba(88,101,242,.28); }
  .caption, .replace { background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.07)); border:1px solid rgba(255,255,255,.24);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 8px 24px rgba(0,0,20,.35); -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%); }
  .replace:hover { background:linear-gradient(140deg,rgba(255,255,255,.3),rgba(255,255,255,.12)); }
  .menu { background:linear-gradient(140deg,rgba(255,255,255,.17),rgba(255,255,255,.05)), rgba(8,8,44,.72); border:1px solid var(--glass-edge);
    box-shadow:var(--glass-shadow); -webkit-backdrop-filter:blur(30px) saturate(170%); backdrop-filter:blur(30px) saturate(170%); }
  .navbtn.on { background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.08)); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }

  /* plans, paywall and mock checkout */
  .topr { display:flex; align-items:center; gap:10px; }
  .btn.pro { background:linear-gradient(140deg,rgba(255,255,255,.24),rgba(255,255,255,.08)); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); color:#fff; }
  .btn.pro svg { color:#ffd479; }
  .lockbadge { position:absolute; top:-2px; right:20px; z-index:2; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; color:#fff;
    background:linear-gradient(140deg,rgba(255,255,255,.3),rgba(255,255,255,.1)); border:1px solid rgba(255,255,255,.3); backdrop-filter:blur(8px); }
  .lockbadge svg { width:12px; height:12px; }
  body.is-pro .lockbadge, body.is-pro .shelfdiv { display:none; }
  .shelfdiv { flex:none; width:1px; align-self:stretch; margin:14px 16px 30px; background:linear-gradient(180deg,transparent,rgba(255,255,255,.28),transparent); }
  .protag { display:none; padding:2px 8px; border-radius:6px; background:#fff; color:var(--ink); font-size:11px; font-weight:700; letter-spacing:.04em; }
  .protag.on { display:inline-flex; }
  .prochip { margin-left:8px; padding:1px 6px; border-radius:5px; background:rgba(255,255,255,.16); font-size:10px; font-weight:700; letter-spacing:.05em; vertical-align:1px; }
  .mi.locked .n, .mi.locked .d { opacity:.75; }
  .mi.all { background:rgba(255,255,255,.1); } .mi.all:hover { background:rgba(255,255,255,.17); } .msep { height:1px; background:var(--glass-line); margin:6px 4px; }
  .mi.promo { margin-top:4px; background:linear-gradient(140deg,rgba(88,101,242,.4),rgba(88,101,242,.16)); }
  .mi.promo:hover { background:linear-gradient(140deg,rgba(88,101,242,.55),rgba(88,101,242,.24)); }
  body.modal-open { overflow:hidden; }
  .modal { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,12,.62);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .modal.open { display:flex; }
  .sheet { position:relative; width:min(1040px,100%); max-height:calc(100vh - 48px); overflow:auto; border-radius:28px; padding:36px 34px 26px;
    background:linear-gradient(140deg,rgba(255,255,255,.12),rgba(255,255,255,.04)), rgba(6,6,38,.86); border:1px solid var(--glass-edge); box-shadow:var(--glass-shadow); }
  .sheet h2 { margin:0; font-size:32px; font-weight:600; letter-spacing:-.035em; text-align:center; }
  .sheet .sub { text-align:center; color:var(--muted); margin:8px 0 26px; }
  .reason { display:flex; width:max-content; max-width:100%; margin:0 auto 14px; align-items:center; gap:8px; padding:7px 14px; border-radius:999px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); font-size:13px; font-weight:600; }
  .reason svg { width:14px; height:14px; }
  .x { position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:50%; border:0; background:rgba(255,255,255,.1); color:#fff; cursor:pointer; display:grid; place-items:center; }
  .x:hover { background:rgba(255,255,255,.18); }
  .plans { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  .plan { position:relative; display:flex; flex-direction:column; padding:24px 20px 22px; border-radius:22px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); }
  .plan.hot { border-color:rgba(130,142,255,.9); background:linear-gradient(160deg,rgba(88,101,242,.3),rgba(255,255,255,.05));
    box-shadow:0 0 0 1px rgba(130,142,255,.45), 0 18px 50px rgba(40,50,200,.35); }
  .plan .badge { position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:#fff; color:var(--ink); font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px; white-space:nowrap; }

<script>
// ---------- Films (real Hald CLUTs sampled from actual film / Fujifilm output) ----------
const FILMS = [

  { id:'PROV', label:'PROVIA 100F',  iso:'100', body:'#1f5fb4', band:'#f3ead0', ink:'#102a55', lut:'provia-100f' },
  { id:'VELV', label:'VELVIA 50',    iso:'50',  body:'#c8202a', band:'#f6e8c8', ink:'#4a0a0e', lut:'velvia-50' },

  { id:'REAL', label:'REALA 100',    iso:'100', body:'#2f9e6a', band:'#f4f0d8', ink:'#0d3322', lut:'reala-100' },
  { id:'SENS', label:'SENSIA 100',   iso:'100', body:'#7a4fb0', band:'#efe6f6', ink:'#2a1745', lut:'sensia-100' },
  { id:'P4X',  label:'PROVIA 400X',  iso:'400', body:'#14407f', band:'#e8eef7', ink:'#0a1d3a', lut:'provia-400x' },
  { id:'S400', label:'SUPERIA 400',  iso:'400', body:'#3f8a3a', band:'#eef0c8', ink:'#173614', lut:'superia-400' },

  { id:'XPRO', label:'SUPERIA XPRO', iso:'200', body:'#b9632b', band:'#f7e6c2', ink:'#4a2208', lut:'superia-xpro' },
  { id:'FP', label:'FP-100C',        iso:'100', body:'#5a5a5a', band:'#f1e9d6', ink:'#111',    lut:'fp-100c' },
  { id:'FPN', label:'FP-100C NEG',   iso:'100', body:'#3a3a3a', band:'#e8dcc0', ink:'#111',    lut:'fp-100c-neg' },
  { id:'ACRS', label:'ACROS 100',    iso:'100', body:'#161616', band:'#e8e8e8', ink:'#000',    lut:'acros-100' },
  { id:'POLA', label:'POLAROID 690', iso:'600', body:'#e8e4d8', band:'#d8362b', ink:'#111',    lut:'polaroid-690' },
];

// ---------- Plans (MOCK: nothing is charged; swap startCheckout() for Razorpay later) ----------
const PLANS = {
  free:     { id:'free',     name:'Free',        price:'₹0',     per:'forever',  note:'Try every look on your own photo' },
  monthly:  { id:'monthly',  name:'Pro Monthly', price:'₹249',   per:'/ month',  amount:249,  note:'Cancel anytime',              term:'Billed monthly · renews until cancelled', cta:'Monthly' },
  yearly:   { id:'yearly',   name:'Pro Yearly',  price:'₹1,499', per:'/ year',   amount:1499, note:'₹125 a month · save 50%',     term:'Billed yearly · renews until cancelled',  cta:'Yearly', badge:'Best value' },
  lifetime: { id:'lifetime', name:'Lifetime',    price:'₹2,999', per:'once',     amount:2999, note:'One payment, yours forever',  term:'One-time payment',                        cta:'Lifetime' },
};
const FREE_LOOKS = ['ORIG', 'PROV', 'VELV', 'REAL', 'S400', 'ACRS'];   // Original + the first 5 looks are free; everything else is Pro
const FREE_MAX_PX = 2048, FREE_FORMATS = ['png', 'jpeg'];
let plan = 'free'; try { const p = (localStorage.getItem('filmroom.plan') || localStorage.getItem('filmit.plan')); if (p && PLANS[p]) plan = p; } catch (e) {}
FILMS.sort((a, b) => FREE_LOOKS.includes(b.id) - FREE_LOOKS.includes(a.id));
const isPro = () => plan !== 'free';
const lookLocked = f => !isPro() && !FREE_LOOKS.includes(f.id);
const LOCK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="7" width="9.6" height="6.6" rx="2"/><path d="M5.4 7V5.2a2.6 2.6 0 0 1 5.2 0V7"/></svg>';

// ---------- 35mm cartridge icon (steel barrel, crimped caps, spool, wrapped label, DX code, film leader) ----------
function canisterSVG(f, i) {
  const cx = 54, R = 34, ry = 9;
  const band = (y1, y2) => `M${cx-R},${y1} A${R},${ry} 0 0 0 ${cx+R},${y1} L${cx+R},${y2} A${R},${ry} 0 0 1 ${cx-R},${y2} Z`;
  const arc = (y, r) => `M${cx-r},${y} A${r},${ry*r/R} 0 0 0 ${cx+r},${y}`;
  const brand = f.id === 'POLA' ? 'POLAROID' : f.lut ? 'FUJIFILM' : '';
  const name = f.id === 'POLA' ? '690' : f.label.replace(/\s+\d+[A-Z]?$/, '');
  const fit = (txt, size, max) => Math.min(max, txt.length * size * .66);
  // DX-style checker code that wraps around the barrel (columns foreshorten toward the edges)
  let dx = '';
  for (let j = 0; j < 9; j++) {
    const th = (-52 + j * 13) * Math.PI / 180, d = 5.5 * Math.PI / 180;
    const x0 = cx + R * Math.sin(th - d), x1 = cx + R * Math.sin(th + d), yo = ry * Math.cos(th);
    for (let r = 0; r < 2; r++) {
      const on = ((i * 5 + j * 3 + r * 7) % 3) !== 0;
      dx += `<rect x="${x0.toFixed(2)}" y="${(98.6 + r * 3.1 + yo).toFixed(2)}" width="${(x1 - x0).toFixed(2)}" height="2.9" fill="${on ? '#101010' : '#d4d6da'}"/>`;
    }
  }
  const t = id => `${id}${i}`;
  return `<svg viewBox="0 8 124 134" aria-hidden="true">
    <ellipse cx="56" cy="134" rx="39" ry="5.5" fill="#000" opacity=".6" filter="url(#fc-blur)"/>
    <!-- steel barrel -->
    <path d="M20,40 L88,40 L88,114 A34,9 0 0 1 20,114 Z" fill="url(#fc-steelH)"/>
    <!-- wrapped paper label -->
    <g clip-path="url(#fc-label)">
      <rect x="18" y="40" width="72" height="72" fill="${f.body}"/>
      <path d="${band(72, 94)}" fill="${f.band}"/>
      <path d="${band(70.6, 72)}" fill="#fff" opacity=".55"/><path d="${band(94, 95.4)}" fill="#fff" opacity=".4"/>
      <path d="${band(96.5, 106)}" fill="#050505" opacity=".38"/>
      ${dx}
    </g>
    <defs><path id="${t('pa')}" d="${arc(53.5, 30)}"/><path id="${t('pb')}" d="${arc(65.5, 31)}"/><path id="${t('pc')}" d="${arc(87, 31)}"/></defs>
    <g font-family="'Google Sans',sans-serif" text-anchor="middle" clip-path="url(#fc-label)">
      ${brand ? `<text font-size="6.2" font-weight="700" fill="#fff" fill-opacity=".92" letter-spacing=".6"><textPath href="#${t('pa')}" startOffset="50%" textLength="${fit(brand, 6.2, 44)}" lengthAdjust="spacingAndGlyphs">${brand}</textPath></text>` : ''}
      <text font-size="8.4" font-weight="800" fill="#fff"><textPath href="#${t('pb')}" startOffset="50%" textLength="${fit(name, 8.4, 44)}" lengthAdjust="spacingAndGlyphs">${name}</textPath></text>
      <text font-size="17" font-weight="800" fill="${f.ink}"><textPath href="#${t('pc')}" startOffset="50%">${f.iso}</textPath></text>
    </g>
    <!-- cylinder shading over barrel + label -->
    <rect x="20" y="40" width="68" height="84" fill="url(#fc-shade)" clip-path="url(#fc-body)"/>
    <rect x="28.5" y="44" width="3.2" height="66" rx="1.6" fill="#fff" opacity=".42" filter="url(#fc-blur2)" clip-path="url(#fc-label)"/>
    <rect x="20" y="46" width="68" height="14" fill="url(#fc-ao)" clip-path="url(#fc-body)"/>
    <rect x="20" y="96" width="68" height="18" fill="url(#fc-aob)" clip-path="url(#fc-body)"/>
    <!-- film leader leaving the felt light-trap -->
    <path d="M80,63 L109,62 L119,70 L119,95 L109,97 L80,97 Z" fill="url(#fc-film)"/>
    <g fill="#160b04">${[89, 97, 105].map(x => `<rect x="${x}" y="65.3" width="4.6" height="3.4" rx="1"/><rect x="${x}" y="91.2" width="4.6" height="3.4" rx="1"/>`).join('')}</g>
    <path d="M81,63.6 L109,62.6" stroke="#fff" stroke-opacity=".22" stroke-width=".9"/>
    <path d="M80,63 L119,70 L119,95 L109,97 L80,97 Z" fill="#000" opacity=".12"/>
    <rect x="77.5" y="60.5" width="5" height="38.5" rx="1.6" fill="#0d0b0a"/>
    <rect x="77.5" y="60.5" width="1.4" height="38.5" rx=".7" fill="#fff" opacity=".12"/>
    <!-- bottom cap -->
    <path d="M18,112 A36,9.5 0 0 0 90,112 L90,122 A36,9.5 0 0 1 18,122 Z" fill="url(#fc-steelH)"/>
    <path d="M18,117 A36,9.5 0 0 0 90,117" fill="none" stroke="#000" stroke-opacity=".35" stroke-width=".7"/>
    <path d="M18,113.2 A36,9.5 0 0 0 90,113.2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".7"/>
    <!-- top cap + spool -->
    <path d="M18,30 A36,9.5 0 0 0 90,30 L90,40 A36,9.5 0 0 1 18,40 Z" fill="url(#fc-steelH)"/>
    <path d="M18,35 A36,9.5 0 0 0 90,35" fill="none" stroke="#000" stroke-opacity=".35" stroke-width=".7"/>
    <path d="M18,31.2 A36,9.5 0 0 0 90,31.2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".7"/>
    <ellipse cx="54" cy="30" rx="36" ry="9.5" fill="url(#fc-top)"/>
    <ellipse cx="54" cy="30.2" rx="29" ry="7.3" fill="none" stroke="#000" stroke-opacity=".28"/>
    <ellipse cx="54" cy="31" rx="29" ry="7.3" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".7"/>

      // DX-style checker code
      const dxw = 40, n = 14, x0 = cx - n * dxw / 2, ty = y2 + 44;
      for (let r = 0; r < 2; r++) for (let j = 0; j < n; j++) { const on = ((f.id.charCodeAt(0) + j * 3 + r * 7) % 3) !== 0; x.fillStyle = on ? '#0d0d0d' : '#d6d8dc'; x.fillRect(x0 + j * dxw, ty + r * 34, dxw - 3, 31); }
      x.fillStyle = 'rgba(255,255,255,.6)'; x.font = '600 30px "Google Sans"'; x.letterSpacing = '6px'; x.fillText('135 · DX CODED', cx, LBH - 38); x.letterSpacing = '0px';
      // repeat the brand around the wrap so the sides never look blank
      x.fillStyle = 'rgba(255,255,255,.55)'; x.font = '700 76px "Google Sans"';
      [cx - 760, cx + 760].forEach(px => { x.fillText(name, px, LBH * .30); });
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
    }
    const labelGeo = new THREE.CylinderGeometry(R + .12, R + .12, 28, 160, 1, true);
    const label = new THREE.Mesh(labelGeo, null); label.rotation.y = Math.PI; g.add(label);

    g.rotation.y = -.14;                    // turn slightly so the label reads and the leader shows on the right
    const imgs = [];
    for (const f of FILMS) {
      const tex = labelTexture(f);
      label.material = new THREE.MeshPhysicalMaterial({ map:tex, roughness:.55, metalness:0, clearcoat:.55, clearcoatRoughness:.28, envMapIntensity:.55 });
      renderer.render(scene, cam);
      imgs.push(renderer.domElement.toDataURL('image/png'));
      tex.dispose(); label.material.dispose();
      await new Promise(r => setTimeout(r, 0));
    }
    document.querySelectorAll('#strip .film').forEach((btn, i) => {
      const img = new Image(); img.alt = ''; img.src = imgs[i]; img.draggable = false;
      const svg = btn.querySelector('svg'); if (svg) svg.replaceWith(img);
    });
  } catch (e) { console.warn('3D cartridges unavailable; keeping SVG fallback.', e); }
})();
</script>
