<!doctype html>
<meta charset="utf-8"><title>Filmroom tests</title>
<!--
  Black-box tests (IV&V): drive the real app in a same-origin iframe through its UI and check
    BR-*  the business rules (docs/BUSINESS_RULES.md): what each plan allows
    SEC-* the security controls and the attacks found in the VAPT (SECURITY.md)
  Needs three local processes (accounts and plans live on the server now; see server/README.md):
    1. cd server && node test/mock-dodo.mjs                 (stand-in for the Dodo API; no network, no money)
    2. cd server && cp test/dev.vars.example .dev.vars && npx wrangler dev --port 8787
    3. python3 -m http.server 8731                           then open  http://localhost:8731/tests/run.html
  Result: the table below; document.title becomes "tests: N/M passed" (and window.__out has the details).
-->
<style>body{font:14px/1.5 system-ui;background:#0b0b1e;color:#e8e8f5;margin:16px}table{border-collapse:collapse;width:100%}td{border-bottom:1px solid #26264a;padding:5px 8px;vertical-align:top}
.ok{color:#4ade80}.no{color:#f87171;font-weight:700}iframe{width:1280px;height:800px;border:1px solid #333;position:absolute;left:-3000px}code{color:#9aa;word-break:break-all}</style>
<h2>Filmroom tests</h2><p id="sum">running…</p><table id="t"></table><div id="host"></div>
<script>
const MB = 1048576, results = [], sleep = ms => new Promise(r => setTimeout(r, ms));
let win, doc;
const API = 'http://localhost:8787';
const post = async (path, body, tk) => (await fetch(API + path, { method: 'POST', headers: tk ? { authorization: 'Bearer ' + tk } : {}, body: JSON.stringify(body || {}) })).json();
const devLogin = async (extra = {}) => (await post('/dev/login', { sub: 'demo-google-user', email: 'demo.user@example.com', name: 'Demo User', ...extra })).token;
const devGrant = (tk, body) => post('/dev/grant', body, tk);
const until = async (fn, ms = 8000, step = 60) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { const v = fn(); if (v) return v; } catch (e) {} await sleep(step); } return false; };
function record(id, name, pass, detail) {
  results.push({ id, name, pass: !!pass, detail: detail === undefined ? '' : String(detail) });
  const tr = document.createElement('tr'); tr.innerHTML = `<td>${id}</td><td></td><td class="${pass ? 'ok' : 'no'}">${pass ? 'PASS' : 'FAIL'}</td><td><code></code></td>`;
  tr.children[1].textContent = name; tr.querySelector('code').textContent = detail === undefined ? '' : String(detail); document.getElementById('t').appendChild(tr);
}
const ONLY = (new URLSearchParams(location.search).get('only') || '').split(',').filter(Boolean);       // ?only=ACC-7,SRV-1 runs just those
const check = async (id, name, fn) => { if (ONLY.length && !ONLY.includes(id)) return; try { const r = await fn(); record(id, name, r === true || (r && r.pass), r && r.detail); } catch (e) { record(id, name, false, 'threw: ' + e.message); } };

// ---------- harness helpers ----------
async function boot(setup, query = '') {                    // fresh app, fresh server-side test account; optional (async) set-up first
  document.getElementById('host').innerHTML = ''; localStorage.clear(); await post('/dev/reset', { sub: 'demo-google-user' }); await fetch('http://localhost:8799/__reset', { method: 'POST', mode: 'no-cors' }).catch(() => {}); if (setup) await setup();
  const f = document.createElement('iframe'); f.src = '../index.html?demo=1' + query + '&t=' + Date.now(); document.getElementById('host').appendChild(f);
  await new Promise(r => f.onload = r); win = f.contentWindow; doc = win.document;
  await until(() => doc.querySelectorAll('#strip .film img').length === 15, 8000);
  win.__dl = []; win.__blobs = [];
  win.HTMLAnchorElement.prototype.click = function () { win.__dl.push({ name: this.download, href: this.href }); };
  const oc = win.URL.createObjectURL.bind(win.URL); win.URL.createObjectURL = b => { win.__blobs.push(b); return oc(b); };
  return f;
}
const $$ = s => doc.querySelector(s), $all = s => [...doc.querySelectorAll(s)];
const png = (w, h, name = 'p.png', color = '#c85a28') => new Promise(r => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, w, h); x.fillStyle = '#fff'; x.fillRect(w / 4, h / 4, w / 2, h / 2); c.toBlob(b => r(new File([b], name, { type: 'image/png' }))); });
const pngHeader = (w, h, name) => { const b = new Uint8Array(33); b.set([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a, 0, 0, 0, 13, 0x49, 0x48, 0x44, 0x52]); const dv = new DataView(b.buffer); dv.setUint32(16, w); dv.setUint32(20, h); b[24] = 8; return new File([b], name, { type: 'image/png' }); };
async function upload(files) {
  const dt = new DataTransfer(); files.forEach(f => dt.items.add(f)); const inp = $$('#file'); inp.files = dt.files; inp.dispatchEvent(new Event('change'));
  let last = '', still = 0; for (let i = 0; i < 500 && still < 6; i++) { await sleep(120); const n = $all('#thumbs .pt').length + '|' + ($$('#toast') || {}).textContent + '|' + $$('#busy').classList.contains('on'); still = n === last ? still + 1 : 0; last = n; }
}
const nPhotos = () => $all('#thumbs .pt').length;
const modalOpen = () => $$('#modal').classList.contains('open');
const reason = () => (($$('.reason') || {}).textContent || '').trim();
const toastText = () => ($$('#toast') || {}).textContent;
const closeAll = () => { if (modalOpen()) $$('[data-close]').click(); };
async function signIn() { $$('#acctbtn').click(); await until(() => $$('[data-demo-signin]'), 2000); $$('[data-demo-signin]').click(); await until(() => !modalOpen() || $$('.plan'), 3000); await sleep(200); closeAll(); await sleep(100); }
async function openAcct(tab = 'general') { $$('#acctbtn').click(); await until(() => $$('.acctwrap'), 2000); if (tab !== 'general') { $$(`[data-atab=${tab}]`).click(); await sleep(120); } }
// "Buying" in tests: the Worker's dev-only /dev/grant route stands in for Dodo's signed webhook (the real webhook path is covered by server/test/e2e-local.mjs).
async function buy(id) { await devGrant(win.localStorage.getItem('filmroom.token'), { plan: id }); await win.refreshAccount(); await sleep(150); }
async function download() { const n = win.__dl.length; $$('#dl').click(); await until(() => win.__dl.length > n || modalOpen() || /Couldn|used all/.test(toastText()), 8000); await sleep(150); return win.__dl.length > n; }
async function blobDims(b) { const bm = await createImageBitmap(b); const r = [bm.width, bm.height]; bm.close(); return r; }
const IDS = ['ORIG', 'PROV', 'VELV', 'REAL', 'S400', 'ACRS', 'ASTI', 'SENS', 'P4X', 'XTRA', '400H', 'XPRO', 'FP', 'FPN', 'POLA'];
const lookBtn = id => $all('#strip .film')[IDS.indexOf(id)];
const unzipNames = async b => { const u = new Uint8Array(await b.arrayBuffer()), dv = new DataView(u.buffer), n = []; for (let i = 0; i < u.length - 30;) { if (dv.getUint32(i, true) === 0x04034b50) { const nl = dv.getUint16(i + 26, true), el = dv.getUint16(i + 28, true), cs = dv.getUint32(i + 18, true); n.push(new TextDecoder().decode(u.subarray(i + 30, i + 30 + nl))); i += 30 + nl + el + cs; } else i++; } return n; };
const hash = async (algo, buf) => btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest(algo, buf))));

(async () => {
  /* ===================== BUSINESS RULES: FREE ===================== */
  await boot();
  await check('BR-F1', 'Free: at most 25 photos open at once; the 26th triggers the upgrade nudge', async () => {
    await upload(await Promise.all(Array.from({ length: 27 }, (_, i) => png(8, 8, `f${i}.png`))));
    const r = reason(), ok = nPhotos() === 25 && /Free allows 25 photos at once/.test(r) && /25 of 25 photos/.test($$('#pcount').textContent); closeAll(); return { pass: ok, detail: `${nPhotos()} photos; ${r}` };
  });
  await boot();
  await check('BR-F2', 'Free: a file over 20 MB is refused before decoding', async () => {
    await upload([new File([new Uint8Array(21 * MB)], 'huge.jpg', { type: 'image/jpeg' })]); const t = toastText(); return { pass: nPhotos() === 0 && /over 20 MB/.test(t), detail: t };
  });
  await check('BR-F3', 'Free: more than 24 megapixels is refused from the file header (6001 x 4001)', async () => {
    await upload([pngHeader(6001, 4001, 'big.png')]); const t = toastText(); return { pass: nPhotos() === 0 && /over 24 megapixels/.test(t), detail: t };
  });
  await check('BR-F4', 'Free: 24 megapixels exactly (6000 x 4000) is not refused for size', async () => {
    await upload([pngHeader(6000, 4000, 'edge.png')]); const t = toastText(); return { pass: !/over 24 megapixels/.test(t), detail: t };
  });
  await boot();
  await check('BR-F5', 'There is no daily upload limit: 30 photos can be uploaded in one day (removing them as we go)', async () => {
    let ok = 0; for (let i = 0; i < 30; i++) { await upload([await png(8, 8, `u${i}.png`)]); if (nPhotos() >= 1) ok++; if (nPhotos() >= 4) { $$('#thumbs .pt .rm').click(); await until(() => $$('#cyes'), 1500); $$('#cyes').click(); await sleep(400); } }
    const stored = JSON.parse(localStorage.getItem('filmroom.usage') || '{}'); return { pass: ok === 30 && !modalOpen() && !('up' in (stored.device || {})), detail: `${ok} of 30 accepted; nothing is counted for uploads` };
  });
  await boot();
  await check('BR-F6', 'Free: 10 downloads a day; the 11th is refused', async () => {
    await upload([await png(64, 48, 'd.png')]); let done = 0; for (let i = 0; i < 10; i++) if (await download()) done++;
    $$('#dlcaret').click(); await sleep(150); const left = $$('#dlmenu .usage b').textContent; $$('#dlcaret').click(); await download(); const r = reason(), ok = done === 10 && /used all 10 downloads/.test(r) && win.__dl.length === 10; closeAll();
    return { pass: ok, detail: `${done} downloads, left: ${left}; ${r}` };
  });
  await boot();
  await check('BR-F7', 'Free: exports are capped at 1024px (3000 x 2000 becomes 1024 x 683)', async () => {
    await upload([await png(3000, 2000, 'big.png')]); await download(); const [w, h] = await blobDims(win.__blobs.at(-1)); return { pass: w === 1024 && h === 683, detail: `${w} x ${h}` };
  });
  await check('ACC-8', 'Before/After switch: Before shows the untouched photo, and Download always saves the edit', async () => {
    await boot(); await upload([await png(64, 48, 'ba.png')]);
    const grab = () => $$('#cv').toDataURL(), side = () => $$('#ba button.on').dataset.v;
    await sleep(400); const untouched = grab();
    $all('.film').find(f => /VELVIA/i.test(f.textContent)).click();
    await until(() => grab() !== untouched, 15000);                 // the look file may take a moment on a real network
    const after = grab(); $$('#ba button[data-v="0"]').click();
    await until(() => grab() !== after, 5000);
    const before = grab(), showsBefore = side() === '0';
    await download(); const backToAfter = side() === '1';
    return { pass: after !== before && showsBefore && backToAfter, detail: `differs ${after !== before}, before shown ${showsBefore}, reset by download ${backToAfter}` };
  });
  await check('BR-F8', 'Free: only JPEG and PNG; TIFF and BMP are Pro items that open the upgrade nudge', async () => {
    $$('#dlcaret').click(); await sleep(150); const locked = $all('#dlmenu .mi.locked[data-f]').map(b => b.dataset.f).sort().join(',');
    $$('#dlmenu .mi[data-f=tiff]').click(); await sleep(250); const r = reason(); closeAll(); return { pass: /tiff/.test(locked) && /bmp/.test(locked) && /TIFF export is a Pro feature/.test(r), detail: `locked: ${locked}; ${r}` };
  });
  await check('BR-F9', 'Free: a Pro look can be previewed but not downloaded', async () => {
    lookBtn('ASTI').click(); await sleep(500); const before = win.__dl.length; $$('#dl').click(); await sleep(400); const r = reason(); closeAll();
    return { pass: win.__dl.length === before && /ASTIA 100F is a Pro look/.test(r), detail: r };
  });
  await check('BR-F10', 'Free: "Download all" (ZIP) is a Pro feature', async () => {
    lookBtn('ORIG').click(); await upload([await png(8, 8, 'z2.png')]); $$('#dlcaret').click(); await sleep(200); const it = $$('#dlmenu .mi.all'), locked = it && it.classList.contains('locked'); it.click(); await sleep(300);
    const r = reason(); closeAll(); return { pass: locked && /Download all is a Pro feature/.test(r), detail: r };
  });

  /* ===================== BUSINESS RULES: PAID PLANS ===================== */
  const PLAN_SPEC = { monthly: { photos: 25, label: 'Pro Monthly' }, yearly: { photos: 25, label: 'Pro Yearly' }, lifetime: { photos: 25, label: 'Lifetime' } };
  for (const [id, sp] of Object.entries(PLAN_SPEC)) {
    await boot(); await signIn(); await buy(id);
    await check(`BR-${id[0].toUpperCase()}1`, `${sp.label}: ${sp.photos} photos open at once`, async () => {
      const batch = []; for (let i = 0; i < sp.photos + 1; i++) batch.push(await png(8, 8, `m${i}.png`)); await upload(batch);
      const t = toastText(); return { pass: nPhotos() === sp.photos && new RegExp(`allows ${sp.photos} photos at once`).test(t) && !modalOpen(), detail: `${nPhotos()} photos; ${t}` };
    });
    await check(`BR-${id[0].toUpperCase()}2`, `${sp.label}: all 14 looks unlocked and every export format available`, async () => {
      const locks = $all('.lockbadge').filter(e => getComputedStyle(e).display !== 'none').length; $$('#dlcaret').click(); await sleep(150); const lockedFormats = $all('#dlmenu .mi.locked[data-f]').length; $$('#dlcaret').click(); await sleep(100);
      return { pass: locks === 0 && lockedFormats === 0, detail: `visible locks ${locks}, locked formats ${lockedFormats}` };
    });
  }
  await boot(); await signIn(); await buy('monthly');
  await check('BR-M3', 'Pro Monthly: full-resolution export (3000 x 2000 stays 3000 x 2000)', async () => {
    await upload([await png(3000, 2000, 'full.png')]); lookBtn('ASTI').click(); await sleep(500); await download(); const [w, h] = await blobDims(win.__blobs.at(-1)); return { pass: w === 3000 && h === 2000, detail: `${w} x ${h}` };
  });
  await check('BR-M4', 'Pro Monthly: "Download all" makes one ZIP with every photo', async () => {
    await upload([await png(40, 30, 'a.png'), await png(40, 30, 'b.png')]); lookBtn('ORIG').click(); await sleep(300);
    $$('#dlcaret').click(); await sleep(150); $$('#dlmenu .mi.all').click(); await until(() => win.__dl.some(d => /\.zip$/.test(d.name)), 20000); await sleep(500);
    const names = await unzipNames(win.__blobs.at(-1)); return { pass: names.length === nPhotos(), detail: `${names.length} files in ZIP for ${nPhotos()} photos` };
  });
  await check('BR-M5', 'Pro Monthly: unlimited downloads (no daily counter, 12 in a row all succeed)', async () => {
    $$('#dlcaret').click(); await sleep(150); const counter = !!$$('#dlmenu .usage'); $$('#dlcaret').click(); await sleep(100); lookBtn('ORIG').click(); await sleep(300);
    const before = win.__dl.length; let done = 0; for (let i = 0; i < 12; i++) if (await download()) done++;
    return { pass: !counter && done === 12 && win.__dl.length - before === 12 && !modalOpen(), detail: `${done} of 12 saved; daily counter shown: ${counter}` };
  });

  /* ===================== ACCOUNT AND BILLING RULES ===================== */
  await boot(); await signIn(); await buy('monthly');
  await check('BR-B1', 'Cancelling keeps Pro until the period ends (access is not cut immediately)', async () => {
    await openAcct('plan'); await until(() => $$('[data-cancelsub]'), 1500); $$('[data-cancelsub]').click(); await sleep(150); $$('[data-confirmcancel]').click(); await sleep(250);
    const kept = /Pro stays until/.test($$('.sheet').textContent), stillBig = true; closeAll();
    const batch = []; for (let i = 0; i < 8; i++) batch.push(await png(8, 8, `k${i}.png`)); await upload(batch); return { pass: kept && nPhotos() === 8, detail: `${nPhotos()} photos accepted while cancelled-but-active` };
  });
  await boot(async () => { const tk = await devLogin(); await devGrant(tk, { plan: 'monthly', cancelAtPeriodEnd: true, nextBillingDate: Date.now() - 86400000 }); localStorage.setItem('filmroom.token', tk); });
  await check('BR-B2', 'A lapsed cancelled subscription is Free again (the Free 1024px export cap applies)', async () => {
    await upload([await png(3000, 2000, 'lapsed.png')]); await download(); const [w, h] = await blobDims(win.__blobs.at(-1)); closeAll(); return { pass: w === 1024 && h === 683, detail: `${w} x ${h}` };
  });
  await boot();
  await check('BR-B3', 'Daily counters cannot be reset by winding the clock back (up to 2 days; beyond that only a server can know)', async () => {
    await upload([await png(8, 8, 'c1.png')]); await download(); const used = JSON.parse(localStorage.getItem('filmroom.usage')).device.down;
    const real = win.Date.now; win.Date.now = () => real() - 30 * 3600000; await download();
    const after = JSON.parse(localStorage.getItem('filmroom.usage')).device.down; win.Date.now = real; return { pass: used === 1 && after === 2, detail: `downloads counted ${used} -> ${after}` };
  });
  await boot();
  await check('BR-B4', 'Signing in does not reset the daily download counter (one shared device counter)', async () => {
    await upload([await png(8, 8, 'x1.png')]); await download(); await signIn(); const d = JSON.parse(localStorage.getItem('filmroom.usage')).device.down; return { pass: d === 1, detail: `downloads counted: ${d}` };
  });

  /* ===================== ACCOUNT DIALOG ===================== */
  await boot(); await signIn();
  await check('ACC-1', 'Account dialog has General, Plan & billing and Usage tabs; each shows its own content', async () => {
    await openAcct(); const tabs = $all('.anav [data-atab]').map(b => b.textContent.trim()), sel = () => $all('.anav [aria-selected=true]').map(b => b.textContent.trim()).join();
    const g = $$('.apane h2').textContent + '|' + sel() + '|' + /Sign-in method/.test($$('.apane').textContent);
    $$('[data-atab=plan]').click(); await sleep(100); const p = $$('.apane h2').textContent + '|' + sel() + '|' + /Payment method/.test($$('.apane').textContent) + /Invoices/.test($$('.apane').textContent);
    $$('[data-atab=usage]').click(); await sleep(100); const u = $$('.apane h2').textContent + '|' + sel() + '|' + /Downloads/.test($$('.apane').textContent) + /What your Free plan allows/.test($$('.apane').textContent);
    const twoColumn = $$('.sheet').classList.contains('acctsheet'); closeAll();
    return { pass: tabs.join() === 'General,Plan & billing,Usage' && /^General\|General\|true$/.test(g) && /^Plan & billing\|Plan & billing\|truetrue$/.test(p) && /^Usage\|Usage\|truetrue$/.test(u) && twoColumn, detail: `${tabs.join(' / ')}; general:${g}; plan:${p}; usage:${u}` };
  });
  await check('ACC-2', 'Other dialogs (plans, sign-in) do not keep the two-column account layout', async () => {
    await openAcct('plan'); $$('[data-changeplan]').click(); await sleep(200); const plansView = !$$('.sheet').classList.contains('acctsheet') && !!$$('.plan'); closeAll();
    return { pass: plansView, detail: `plans view single-column: ${plansView}` };
  });
  await boot(); await signIn();
  await check('ACC-3', 'Usage tab shows the real counts (1 download, 2 photos open) and this plan\'s limits; no upload counter', async () => {
    await upload([await png(8, 8, 'a.png'), await png(8, 8, 'b.png')]); await download(); await openAcct('usage'); const t = $$('.apane').textContent.replace(/\s+/g, ' '); closeAll();
    return { pass: !/Uploads/.test(t) && /Downloads\s*1 \/ 10/.test(t) && /Photos open\s*2 \/ 25/.test(t) && /Downloads per day\s*10/.test(t) && /File size\s*up to 20 MB/.test(t) && /Export size\s*up to 1024px/.test(t) && /Download all \(ZIP\)\s*Not included/.test(t), detail: t.slice(0, 240) };
  });
  await boot(); await signIn(); await buy('monthly');
  await check('ACC-4', 'Account removal: refused while a subscription is active; allowed after cancelling; clears the saved data and signs out', async () => {
    const tk0 = localStorage.getItem('filmroom.token'); await openAcct(); $$('[data-delete]').click(); await sleep(150); const blockedMsg = /Cancel it first/.test($$('.sheet').textContent) && !$$('[data-confirmdelete]'); closeAll();
    await openAcct('plan'); $$('[data-cancelsub]').click(); await sleep(150); $$('[data-confirmcancel]').click(); await sleep(250);
    $$('[data-atab=general]').click(); await sleep(100); $$('[data-delete]').click(); await sleep(150); const allowed = !!$$('[data-confirmdelete]'); $$('[data-confirmdelete]').click(); await sleep(400);
    const gone = (await fetch(API + '/me', { headers: { authorization: 'Bearer ' + tk0 } })).status === 401, signedOut = $$('#acctbtn').classList.contains('out') && !localStorage.getItem('filmroom.token');
    return { pass: blockedMsg && allowed && gone && signedOut, detail: `blocked while active: ${blockedMsg}; allowed after cancel: ${allowed}; old session refused by server: ${gone}; signed out: ${signedOut}` };
  });
  await boot(); await signIn();
  await check('ACC-5', 'Account removal on a Free account: confirm, then the record and session are gone and you are signed out', async () => {
    const tk0 = localStorage.getItem('filmroom.token'); await openAcct(); $$('[data-delete]').click(); await sleep(120); $$('[data-confirmdelete]').click(); await sleep(500);
    const gone = (await fetch(API + '/me', { headers: { authorization: 'Bearer ' + tk0 } })).status === 401;
    return { pass: gone && !localStorage.getItem('filmroom.token') && $$('#acctbtn').classList.contains('out'), detail: 'server record and session gone; signed out' };
  });

  await boot(); await signIn(); await buy('yearly');
  await check('ACC-6', 'Invoice: the Invoice button downloads the buyer\'s own PDF from the server', async () => {
    await openAcct('plan'); const n = win.__dl.length, shown = /Pro Yearly/.test($$('.apane').textContent) && !!$$('[data-receipt]'); $$('[data-receipt]').click(); await until(() => win.__dl.length > n, 4000);
    const blob = win.__blobs.at(-1), head = (await blob.text()).slice(0, 8), name = win.__dl.at(-1).name;
    return { pass: shown && head.startsWith('%PDF') && blob.type === 'application/pdf' && name === 'filmroom-invoice-pay_dev1.pdf', detail: `${name}, ${blob.size} bytes, starts ${head}` };
  });
  await boot(async () => { localStorage.setItem('filmroom.token', await devLogin({ name: '<img src=x onerror=window.__n=1> Eve\nTOTAL PAID' })); });
  await check('ACC-7', 'A display name containing markup or newlines is shown as plain text', async () => {
    await until(() => $$('#acctbtn').classList.contains('in'), 4000); await openAcct('general'); await sleep(200); const txt = $$('.prof').textContent;
    return { pass: win.__n === undefined && !doc.querySelector('.sheet img[onerror]') && /<img src=x/.test(txt) && !/\n/.test($$('.prof b').textContent), detail: txt.trim().slice(0, 80) };
  });
  await boot(); await signIn();
  await check('SRV-1', 'Signed in, the 11th Free download is refused using the SERVER\'s count (wiping this browser\'s counter does not help, nor does asking the API directly)', async () => {
    await upload([await png(64, 48, 's.png')]); let done = 0; for (let i = 0; i < 10; i++) if (await download()) done++;
    win.localStorage.setItem('filmroom.usage', '{}');                                         // a user who erases this browser's own count
    const before = win.__dl.length; await download(); const r = reason(); closeAll();
    const direct = await post('/usage/download', { n: 1 }, win.localStorage.getItem('filmroom.token'));      // ...or skips the page and asks the server itself
    return { pass: done === 10 && win.__dl.length === before && /used all 10 downloads/.test(r) && direct.allowed === false && direct.used === 10, detail: `${done} saved; after wiping local count: ${r}; direct API call: ${JSON.stringify(direct)}` };
  });
  await boot(); await signIn();
  await check('PAY-1', 'Buying: Pay asks the server for a Dodo checkout link for that plan and sends the buyer there', async () => {
