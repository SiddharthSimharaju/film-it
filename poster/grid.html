<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Filmroom poster: film grid</title>
<!--
  Square "coming soon" poster: twelve film rolls (just the films, no boxes) in a 4 x 3 grid, the Filmroom logo on top,
  a heading, a subheading and a "Coming very soon" badge below. Rendered at 2160 x 2160 (open this page at that viewport and screenshot it).
  Cartridges: poster/grid-art/*.webp (3D renders, see tools/render-cartridges.html).
-->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,100..900&family=Google+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#131056; --ink:#06061c; --orange:#ff7a3d; }
  * { box-sizing:border-box; margin:0; }
  html, body { background:#000; }
  body { font-family:"Google Sans", system-ui, sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }
  .poster { position:relative; width:2160px; height:2160px; overflow:hidden; background:
      radial-gradient(70% 46% at 50% 34%, rgba(86,74,230,.30), transparent 70%),
      radial-gradient(60% 40% at 50% 108%, rgba(255,122,61,.16), transparent 70%),
      var(--navy); }
  .brand { position:absolute; top:78px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:20px;
    font:900 44px/1 Archivo, sans-serif; font-stretch:125%; text-transform:uppercase; letter-spacing:-.01em; }
  .brand svg { width:60px; height:60px; }
  /* just the films: no boxes, no labels (each cartridge already carries its own name) */
  .grid { position:absolute; left:100px; right:100px; top:176px; display:grid; grid-template-columns:repeat(4, 1fr); row-gap:0; justify-items:center; }
  .grid img { width:446px; height:480px; object-fit:contain; filter:drop-shadow(0 26px 22px rgba(0,0,20,.5)); }
  h1 { position:absolute; left:0; right:0; top:1692px; text-align:center; font:600 104px/1.04 "Google Sans", sans-serif; letter-spacing:-.025em; }
  .sub { position:absolute; left:50%; transform:translateX(-50%); top:1830px; width:1640px; text-align:center; font:400 42px/1.38 "Google Sans", sans-serif; color:rgba(255,255,255,.80); text-wrap:balance; }
  .sub b { color:#fff; font-weight:600; }
  .badge { position:absolute; left:50%; transform:translateX(-50%); top:2002px; display:inline-flex; align-items:center; gap:18px; padding:20px 42px 20px 32px; border-radius:999px;
    background:#fff; color:var(--ink); font:700 40px/1 "Google Sans", sans-serif; letter-spacing:.01em; white-space:nowrap; box-shadow:0 18px 50px rgba(0,0,30,.45); }
  .badge i { width:20px; height:20px; border-radius:50%; background:var(--orange); box-shadow:0 0 0 8px rgba(255,122,61,.25); }
</style>
</head>
<body>
<div class="poster" id="poster">
  <div class="brand"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="5" width="26" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="15" cy="15" r="4.6" fill="#fff"/><rect x="5.5" y="2.5" width="6" height="3.5" rx="1.5" fill="#fff"/></svg>Filmroom</div>
  <div class="grid">
    <img src="grid-art/p400.webp" alt="Kodak Portra 400"><img src="grid-art/velv.webp" alt="Fujifilm Velvia 50"><img src="grid-art/trix.webp" alt="Kodak Tri-X 400"><img src="grid-art/ektr.webp" alt="Kodak Ektar 100">
    <img src="grid-art/prov.webp" alt="Fujifilm Provia 100F"><img src="grid-art/koda.webp" alt="Kodak Kodachrome 64"><img src="grid-art/acrs.webp" alt="Fujifilm Acros 100"><img src="grid-art/s400.webp" alt="Fujifilm Superia 400">
    <img src="grid-art/hp5.webp" alt="Ilford HP5 Plus 400"><img src="grid-art/400h.webp" alt="Fujifilm Pro 400H"><img src="grid-art/pola.webp" alt="Polaroid 690"><img src="grid-art/ekta.webp" alt="Kodak Ektachrome 100">
  </div>
  <h1>Make any photo look shot on film.</h1>
  <p class="sub"><b>24 film looks</b> from Kodak, Fujifilm and Ilford, plus grain, crop and adjustments. All in your browser, and your photos never leave your device.</p>
  <div class="badge"><i></i>Coming very soon</div>
</div>
</body>
</html>
